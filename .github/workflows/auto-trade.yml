name: Automatic daily bot

on:
  schedule:
    # GitHub starts scheduled jobs late, and latest of all on the hour: the old single
    # "0 15" start was running 6 to 9 hours late, after the market had closed, when the bot
    # can do nothing. So ask for several starts, off the hour. The first one to find the
    # market open trades; the rest see that the day is done and stop (see auto-trade.js).
    # 13:53 UTC is 9:53am New York in summer; in winter the market is still closed then
    # and 14:53 is the first that counts.
    - cron: "53 13,14,16,17 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-trade
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run the bot on the Alpaca practice account
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # "Run workflow" by hand trades even if today's scheduled run already has.
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        run: node scripts/auto-trade.js
      - name: Save what it did
        run: |
          git config user.name "trading-lab-bot"
          git config user.email "trading-lab-bot@users.noreply.github.com"
          git add live/auto-log.json live/auto-state.json
          git diff --cached --quiet && exit 0
          git commit -m "Daily bot run"
          git pull --rebase origin main
          git push
